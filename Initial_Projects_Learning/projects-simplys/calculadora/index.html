<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculadora</h1>
    <div class="container-main">
        <div class="tela">
            <h1 class="tela-numeros"></h1>
        </div>
        <div class="botoes-content">
            <div class="numeros">
                <button class="botao-numero key1">1</button>
                <button class="botao-numero key2">2</button>
                <button class="botao-numero key3">3</button>
                <button class="botao-numero key4">4</button>
                <button class="botao-numero key5">5</button>
                <button class="botao-numero key6">6</button>
                <button class="botao-numero key7">7</button>
                <button class="botao-numero key8">8</button>
                <button class="botao-numero key9">9</button>
                <button class="botao-numero key0">0</button>
                <button class="botao-numero key-igual">=</button>
            </div>
            <div class="operacoes">
                <button class="botao-operator operator-add">+</button>
                <button class="botao-operator operator-sub">-</button>
                <button class="botao-operator operator-mul">*</button>
                <button class="botao-operator operator-div">/</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
