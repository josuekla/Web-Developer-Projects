<!DOCTYPE html>
<html>

<head>
  <title>CSS Positioning Exercise</title>
  <style>
    /* Write your code here */
    .blue-box {
      background: blue;
      width:500px;
      height: 300px;
      position: relative;
      top: 200px;
      left: 200px;
    }
    .red-circle{
      background: red;
      height: 200px;
      width: 200px;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
    }
    p{
      color: rgb(255, 255, 255);
      font-size:25px;
      position: absolute;
      top: 60px;
      left: 27px;
    }
  </style>
</head>

<body>
  <div class="blue-box">
    <div class="red-circle">
      <p>Glória a Deus!</p>
    </div>
  </div>

</body>

</html>
