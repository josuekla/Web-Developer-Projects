<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mondrian Project</title>
  <style>
    /* 
    Write your CSS here 
    Gap Colour: #000
    White: #F0F1EC
    Red: #E72F24
    Black: #232629
    Blue: #004592
    Yellow: #F9D01E

    For dimensions, see dimensions.png image.
    HINT: Remember you can't change the properties of grid lines.
    But grid lines are transparent!
    */
    .grid-container {
      margin: auto;
      display: grid;
      background-color: #000;
      width: 748px;
      height: 748px;
      gap: 9px;
      grid-template-columns: 320px 198px 153px 50px;
      grid-template-rows: 414px 130px 155px 20px;

    }

    .grid-container > * {
      font-size: 40px;
      color: yellow
    }
    .red {
      background-color: red;
    }
    .white1{
      grid-area: 2 / 2 / 1 / 5;
      background-color:#f0f1ec;
    }

    .white2{
      background-color:#f0f1ec;
      grid-area: 2 / 1 / 4 / 1
    }
    .white3{
      background-color:#f0f1ec;
      grid-area: 2 / 2 / 4 / 4;
    }
    .white4{
      background-color:#f0f1ec;
      grid-area: 3 / 4 / 5 / 4
    }
    .white5{
      grid-row: span 2
    }
    
    .blue{
      background-color: blue;
      
    }
    
    .white {
      background-color:#f0f1ec;
    }
    .yellow {
      background-color: #F9D01E;
    }
    .black{
      background-color: #232629;
    }
  </style>
</head>

<body>
  <!-- Write your HTML here -->
   <div class="grid-container">
    <div class="grid-item red">1</div>
    <div class="grid-item white1">2</div>
    <div class="grid-item white2">3</div>
    <div class="grid-item white3">4</div>
    <div class="grid-item blue">5</div>
    <div class="grid-item white4">6</div>
    <div class="grid-item white">7</div>
    <div class="grid-item yellow">8</div>
    <div class="grid-item black">9</div>
   </div>
</body>

</html>
