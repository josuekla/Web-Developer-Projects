<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!DOCTYPE html>
    <html>

    <head>
        <style>
            .grid-container {
                display: grid;
                grid-template-areas:
                    "item1 item2"
                    "item3 item4 item5"
                ;
                grid-template-columns: 10fr 1fr;
                grid-template-rows: auto;
                grid-gap: 10px;
                background-color: #2196F3;
                padding: 10px;
            }

            .grid-container>div {
                background-color: rgba(255, 255, 255, 0.8);
                text-align: center;
                padding: 20px 0;
                font-size: 30px;
            }
        </style>
    </head>

    <body>

        <h1>The grid-template Property</h1>

        <p>The grid-template property can be used as a shorthand property for the <em>grid-template-rows</em> and the
            <em>grid-template-columns</em> properties.
        </p>
        <p>This grid layout has three columns, and the first row is 150px high:</p>

        <div class="grid-container">
            <div class="item1">1</div>
            <div class="item2">2</div>
            <div class="item3">3</div>
            <div class="item4">4</div>
            <div class="item5">5</div>
        </div>

    </body>

    </html>
</body>

</html>
